name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "keymap-drawer/**"

permissions:
  actions: read
  contents: write

jobs:
  build:
    # DYA Studio 版本：使用 cormoran 的 ZMK fork 提供的构建 action
    # （对应 ZMK `main+dya`，含 DYA Studio / 蓝牙广播 / 监视器所需能力）
    uses: cormoran/zmk/.github/workflows/build-user-config.yml@v0.3-branch+dya

  # keymap-drawer
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      commit_message: "[Draw] ${{ github.event.head_commit.message }}"
      destination: "commit"
      fail_on_error: ${{ fromJSON(true) }}
