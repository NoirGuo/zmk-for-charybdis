# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # Charybdis 键盘左半（peripheral）
  - board: nice_nano//zmk
    shield: charybdis_left
    artifact-name: charybdis_left
  # Charybdis 键盘右半（central，带轨迹球/旋钮）+ DYA Studio
  - board: nice_nano//zmk
    shield: charybdis_right
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: charybdis_right
  # 独立 OLED 状态监视器（监听键盘 BLE 广播）
  - board: nice_nano//zmk
    shield: monitor_adapter dongle_display
    artifact-name: charybdis_monitor_display
  # 键盘设置复位
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: charybdis_settings_reset
  # 监视器设置复位
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: charybdis_monitor_settings_reset
