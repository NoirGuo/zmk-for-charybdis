# This file generates the GitHub Actions matrix
---
include:
  # Charybdis 键盘左半（peripheral）
  - board: nice_nano//zmk
    shield: charybdis_left
    artifact-name: charybdis_left
  # Charybdis 键盘右半（peripheral，带轨迹球）：输入经 split 转发到 dongle
  - board: nice_nano//zmk
    shield: charybdis_right
    artifact-name: charybdis_right
  # Charybdis Dongle（USB 中央接收器：GC9A01 屏 + DYA Studio）
  - board: nice_nano//zmk
    shield: charybdis_dongle dongle_display
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: charybdis_dongle_display
  # 键盘设置复位
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: charybdis_settings_reset
