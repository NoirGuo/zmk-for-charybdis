# =========================================================================
# Charybdis 主配置（config/charybdis.conf）
# 此文件被左右两半共同引用，只放「两侧通用」的配置项。
# central 专属项见 charybdis_right.conf（right 半是 central），
# peripheral 专属项见 charybdis_left.conf（left 半是 peripheral）。
# =========================================================================

# ---- BLE 连接参数（原有，保留）----
# CONFIG_BT_LL_SW_LLCP_LEGACY=y
# CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
# CONFIG_BT_PERIPHERAL_PREF_LATENCY=16
# CONFIG_BT_BUF_ACL_TX_COUNT=32
# CONFIG_BT_L2CAP_TX_BUF_COUNT=32

CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ZMK_KEYBOARD_NAME="Charybdis"

# ---- ZMK Studio（原有，保留）----
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# ---- 键盘 RGB 灯带（原有，保留）----
# 注意：ZMK_RGB_UNDERGLOW 会自动 select LED_STRIP；WS2812 驱动由 devicetree 的
# worldsemi,ws2812-spi compatible 自动启用。旧版（v0.3）的 CONFIG_WS2812_STRIP /
# CONFIG_LED_STRIP 符号在 Zephyr 4.1 已移除，不可再手动赋值。
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# ---- 旋钮编码器 EC11（原有，保留）----
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ---- 鼠标/轨迹球（原有，保留 pointing）----
CONFIG_ZMK_POINTING=y

# =========================================================================
# 以下为 DYA Studio 功能新增项（两侧通用部分）
# =========================================================================

# ---- 内核升级后运行时绑定必需（Zephyr 4.1 + Custom Protocol）----
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS_IN_BINDINGS=y

# 说明：DYA 功能模块（CUSTOM_SETTINGS / DEVICE_INFO / RUNTIME_MACRO /
# RUNTIME_COMBO / RUNTIME_SENSOR_ROTATE / SETTINGS_RPC 等）的「底座」依赖
# ZMK 核心里 central-only 编译的源文件（behavior_queue.c / keymap.c / combo.c /
# keycode_state_changed.c 等，见核心 app/CMakeLists.txt 的
# `if ((NOT CONFIG_ZMK_SPLIT) OR CONFIG_ZMK_SPLIT_ROLE_CENTRAL)` 块）。
# 这些底座若放在两侧通用，peripheral（left）半会因缺失这些符号而链接失败
# （undefined reference to zmk_behavior_queue_add / zmk_keymap_highest_layer_active 等）。
# 故所有 DYA 功能底座与 *_STUDIO_RPC 变体统一放到 charybdis_right.conf（central 半）。
# peripheral（left）半只保留 BATTERY_HISTORY / SETTINGS_RPC / SPLIT_RELAY_EVENT
# 等不依赖 central-only 符号的最小配置（见 charybdis_left.conf）。

# ---- 分体事件中继 + 设置防抖（两侧通用）----
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# ---- 栈/缓冲区（两侧通用的部分）----
# 注：ZMK_STUDIO_RPC_* 系列参数仅在 central 半生效（见 charybdis_right.conf），
# 不放在此处以免 peripheral 半出现无意义的配置项。
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
