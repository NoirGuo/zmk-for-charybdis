CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_EXT_POWER=y

# 轨迹球 PMW3610：Zephyr 4.1 主线驱动（CONFIG_INPUT_PMW3610 由
# devicetree 的 pixart,pmw3610 节点自动启用）。
# 方向/滚动处理（zip_*）在 dongle（central）的 input-listener 中执行，
# 右半仅通过 zmk,input-split 把原始 input 事件转发到 dongle。

# 右半是 split peripheral：ZMK 4.1 的 ZMK_USB 依赖 central 角色
# （nice_nano 板级 defconfig 默认 ZMK_USB=y，这里显式关闭）
CONFIG_ZMK_USB=n

# DYA runtime 绑定需要 local IDs（同左半）
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS=y

# ---------------------------------------------------------------------------
# DYA Studio peripheral 端支持（同左半）
# ---------------------------------------------------------------------------
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
