# =========================================================================
# Charybdis RIGHT 半（CENTRAL）配置
# 注意：charybdis 的 right 半是 BLE central（见 Kconfig.defconfig），
# 轨迹球（PMW3610）也位于 right 半 → 轨迹球是 central 本地设备。
# 因此本半承载：Studio（USB）+ 全部 DYA central 侧功能 + 轨迹球驱动。
# =========================================================================

# ---- SPI + 输入 + 鼠标（原有，保留）----
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_POINTING=y

# ---- 外接电源（原有，保留）----
CONFIG_ZMK_EXT_POWER=y

# ---- 旋钮 EC11（原有，保留）----
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# =========================================================================
# 轨迹球驱动：cormoran pmw3610（替换原 DoctorWangWang 驱动）
# =========================================================================
CONFIG_PMW3610=y

# 新驱动的编译期默认参数（替代旧驱动的 CONFIG_PMW3610_CPI 等）
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_INVERT_X=y
# 如需 X/Y 轴交换：CONFIG_PMW3610_SWAP_XY=y
# 如需 Y 轴反转：CONFIG_PMW3610_INVERT_Y=y
# 最小报告间隔（单位 ms，0 = 不减速）：CONFIG_PMW3610_REPORT_INTERVAL_MIN=0

# ---- 轨迹球 DYA Studio RPC（传感器信息/诊断/寄存器/帧捕获）----
CONFIG_ZMK_PMW3610_STUDIO_RPC=y

# ---- 轨迹球运行时设置（CPI/轴/降档时间等在线调节）----
CONFIG_ZMK_PMW3610_CUSTOM_SETTINGS=y

# ---- 设备身份上报（noirix-auth 白名单）----
# 上报 MCU 唯一 ID（device_id）给 dya studio 宿主侧做白名单校验。
# 只在 central 半（right）开启：Kconfig 里 depends on ZMK_STUDIO_RPC，
# peripheral 半无 RPC 会自动关闭。select HWINFO 自动带上依赖。
CONFIG_NOIRIX_AUTH=y

# =========================================================================
# 以下为 DYA Studio 功能（central 侧，right 半）
# =========================================================================

# ---- ZMK Studio（central 走 USB）----
CONFIG_ZMK_STUDIO=y

# ---- BLE 连接管理（分体键盘 central）----
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# ---- 电池历史 ----
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=y

# ---- 从分体外设（left 半）获取电池电量 ----
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# ---- 设置 RPC（底座 CONFIG_SETTINGS + SETTINGS_RPC + STUDIO 变体）----
CONFIG_SETTINGS=y
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# =========================================================================
# DYA 功能模块（底座 + Studio RPC 变体，仅 central 半）
# 底座（CUSTOM_SETTINGS / DEVICE_INFO / RUNTIME_MACRO / RUNTIME_COMBO /
# RUNTIME_SENSOR_ROTATE）依赖 ZMK 核心里 central-only 编译的源文件
# （behavior_queue.c / keymap.c / combo.c / keycode_state_changed.c 等），
# 若放在两侧通用会让 peripheral（left）半链接失败。故底座也在此处（central 半）开启。
# *_STUDIO_RPC 变体依赖 ZMK_STUDIO_RPC（由 ZMK_STUDIO 仅在 central 半 select），
# 会编译需要 proto/zmk/custom.pb.h 的代码，同样不能放在两侧通用。
# =========================================================================
# ---- 底座 ----
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y

# ---- Studio RPC 变体 ----
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y

# ---- 分体事件中继 + 栈 ----
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768

# ---- 运行时输入处理器（轨迹球灵敏度/旋转/吸附在线调节）----
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# ---- 设置防抖 ----
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# ---- 保留 DYA 功能集所需的栈/缓冲区（central）----
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000
# 大值设置上限：ZMK_RUNTIME_MACRO_MAX_BYTES 的 range 是
# [VALUE_MAX_SIZE, LARGE_VALUE_MAX_SIZE]，VALUE_MAX_SIZE 在 PROTOBUF 开启时固定 64。
# 若不显式抬高，central 半 LARGE_VALUE_MAX_SIZE 回落默认 64 → range=[64,64]，
# RUNTIME_MACRO_MAX_BYTES 的 default 256 被 clamp 到 64 → Kconfig abort。
# 此参数属于 CUSTOM_SETTINGS 模块（if ZMK_CUSTOM_SETTINGS 块内），只在 central 半
# 开启该模块时需要；peripheral 半无 CUSTOM_SETTINGS，无需此参数。
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
