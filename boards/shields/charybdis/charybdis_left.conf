
# 旋钮配置
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# MOUSE
CONFIG_ZMK_POINTING=y

# left 是 split peripheral：ZMK 4.1 的 ZMK_USB 依赖 central 角色
# （nice_nano 板级 defconfig 默认 ZMK_USB=y，这里显式关闭以消除 Kconfig 警告）
CONFIG_ZMK_USB=n

# ZMK_STUDIO 只在 central 端自动 select ZMK_STUDIO_RPC，而
# ZMK_BEHAVIOR_LOCAL_IDS_IN_BINDINGS 依赖 ZMK_BEHAVIOR_LOCAL_IDS；
# DYA runtime 绑定需要 local IDs，peripheral 端需显式开启
CONFIG_ZMK_BEHAVIOR_LOCAL_IDS=y

# ---------------------------------------------------------------------------
# DYA Studio peripheral 端支持（移植自 noirix44 monitor 分支）
# ---------------------------------------------------------------------------
CONFIG_ZMK_BATTERY_HISTORY=y

CONFIG_ZMK_SETTINGS_RPC=y

CONFIG_ZMK_SPLIT_RELAY_EVENT=y

CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
