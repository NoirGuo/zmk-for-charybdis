# =========================================================================
# Charybdis LEFT 半（PERIPHERAL）配置
# 注意：charybdis 的 left 半是 BLE peripheral（central 在 right 半）。
# 本半只承载 peripheral 侧所需的最小 DYA 功能。
# =========================================================================

# ---- 旋钮 EC11（原有，保留）----
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ---- 运行时旋钮（runtime sensor rotate）----
# 底座（ZMK_RUNTIME_SENSOR_ROTATE）在两侧通用 conf 里，本半有 left_encoder_1
# 需要它来编译 zmk,behavior-runtime-sensor-rotate。
# 但 ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC 在 Kconfig 里是 default y（依赖
# ZMK_STUDIO），若不显式关闭，peripheral 半也会开启它，导致该模块 CMakeLists
# include(nanopb)，而 peripheral 半没有 ZMK_STUDIO_RPC 初始化 nanopb，进而
# FindNanopb.cmake 报 "c_std_11 is not known to C compiler"。故此处显式关闭。
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=n

# ---- 鼠标（原有，保留）----
CONFIG_ZMK_POINTING=y

# ---- DYA 电池历史（peripheral 侧也记录，经 central 上报）----
CONFIG_ZMK_BATTERY_HISTORY=y

# ---- 设置 RPC（peripheral 侧最小依赖）----
CONFIG_ZMK_SETTINGS_RPC=y

# ---- 分体事件中继 ----
CONFIG_ZMK_SPLIT_RELAY_EVENT=y

# ---- 设置防抖 ----
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
