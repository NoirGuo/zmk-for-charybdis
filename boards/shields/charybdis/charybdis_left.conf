# =========================================================================
# Charybdis LEFT 半（PERIPHERAL）配置
# 注意：charybdis 的 left 半是 BLE peripheral（central 在 right 半）。
# 本半只承载 peripheral 侧所需的最小 DYA 功能。
# =========================================================================

# ---- 旋钮 EC11（原有，保留）----
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# 说明：left 半有实体旋钮（left_encoder_1），但 ZMK 分体架构里 peripheral 半
# 的 sensor 事件会自动 relay 给 central 处理（split/peripheral.c 订阅
# zmk_sensor_event → central 的 keymap.c 执行 sensor_binding_process）。
# 因此 runtime-sensor-rotate 底座（ZMK_RUNTIME_SENSOR_ROTATE）依赖 central-only
# 的 behavior_queue.c，只放在 central 半（right.conf），left 半不开启。

# ---- 鼠标（原有，保留）----
CONFIG_ZMK_POINTING=y

# ---- DYA 电池历史（peripheral 侧也记录，经 central 上报）----
CONFIG_ZMK_BATTERY_HISTORY=y

# ---- 设置 RPC（peripheral 侧最小依赖）----
CONFIG_ZMK_SETTINGS_RPC=y

# ---- 分体事件中继 ----
CONFIG_ZMK_SPLIT_RELAY_EVENT=y

# ---- 设置防抖 ----
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
