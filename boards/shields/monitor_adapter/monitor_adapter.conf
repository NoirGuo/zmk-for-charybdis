CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_CENTRAL=n
CONFIG_ZMK_SPLIT=n
CONFIG_ZMK_USB=n
CONFIG_ZMK_BLE=n

CONFIG_ZMK_DISPLAY=y
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_SSD1306=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_SETTINGS=y
CONFIG_ZMK_EXT_POWER=n
CONFIG_ZMK_DONGLE_MONITOR=y
CONFIG_ZMK_DONGLE_MONITOR_CHANNEL=1

# Monitor (dongle) own battery for the middle status bar.
# ZMK_BLE is disabled here so ZMK_BATTERY_REPORTING is NOT implied; enable it
# explicitly so app/src/battery.c compiles and zmk_battery_state_of_charge()
# returns a live value (sampled every CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60s).
CONFIG_ZMK_BATTERY=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y

# The scanner produces no key/sensor events, so the activity module would flip
# to IDLE after the default 30s idle timeout and stop the battery sampling
# timer. Disable the idle timeout so the monitor battery keeps updating.
CONFIG_ZMK_IDLE_TIMEOUT=0

# The monitor receiver has NO physical keys (kscan-mock 0x0), so once ZMK
# blanks the display on idle (CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE defaults to y
# with SSD1306; idle timeout defaults to 30000ms) there is no input source to
# ever wake it up again. Keep the screen always on.
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# The scanner has no physical keys or keymap to edit in ZMK Studio.
# Keep its display settings local to firmware; Studio requires a physical layout.
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
